<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Box Office</title>
<style>
  :root { --bg:#f5f5f7; --fg:#1d1d1f; --muted:#5e5e63; --border:#d9d9de; --brand:#ff9f0a; --err:#b42318; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121213; --fg:#f5f5f7; --muted:#a1a1a6; --border:#343437; --err:#f97066; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-user-select:none; }
  main { height:100%; box-sizing:border-box; padding:28px 28px 20px; display:flex; flex-direction:column; gap:14px; }
  header { display:flex; align-items:center; gap:12px; }
  h1 { margin:0; font:700 24px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; letter-spacing:-.022em; }
  .tag { color:var(--muted); font-size:12px; margin-top:2px; }
  #status { font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; }
  #detail { color:var(--muted); margin-top:-8px; min-height:16px; }
  .spin { width:12px; height:12px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--brand); animation:s .8s linear infinite; flex:none; }
  @keyframes s { to { transform:rotate(360deg); } }
  #log { flex:1; overflow:auto; margin:0; padding:10px; border:1px solid var(--border); border-radius:8px; font:11px ui-monospace, Menlo, monospace; color:var(--muted); white-space:pre-wrap; -webkit-user-select:text; }
  .error #status { color:var(--err); }
  .error .spin { display:none; }
</style>
</head>
<body>
<main id="root">
  <header>
    <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#D5742E"/>
      <g transform="rotate(-12 16 16)">
        <path d="M6 10.5h20v3a2.5 2.5 0 0 0 0 5v3H6v-3a2.5 2.5 0 0 0 0-5z" fill="#2a1d14"/>
        <path d="M20 11.5v9" stroke="#D5742E" stroke-width="1.2" stroke-dasharray="1.4 1.4"/>
        <path d="m13 13 .9 1.9 2.1.3-1.5 1.5.4 2.1-1.9-1-1.9 1 .4-2.1-1.5-1.5 2.1-.3z" fill="#D5742E"/>
      </g>
    </svg>
    <div><h1>Box Office</h1><div class="tag">Jarvis, find me a job.</div></div>
  </header>
  <div id="status"><span class="spin"></span><span id="title">Getting ready…</span></div>
  <div id="detail"></div>
  <pre id="log"></pre>
</main>
<script>
  const logEl = document.getElementById("log");
  window.addLine = (line) => {
    logEl.textContent += line + "\n";
    if (logEl.textContent.length > 60000) logEl.textContent = logEl.textContent.slice(-40000);
    logEl.scrollTop = logEl.scrollHeight;
  };
  window.setStatus = (title, detail) => {
    document.getElementById("title").textContent = title;
    document.getElementById("detail").textContent = detail || "";
  };
  window.setError = (message) => {
    document.getElementById("root").classList.add("error");
    window.setStatus("Couldn't start", message);
  };
</script>
</body>
</html>
